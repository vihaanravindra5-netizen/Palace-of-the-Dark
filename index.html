<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monster Wave Slayer</title>
  <style>
    :root {
      --bg: #0f1724;
      --panel: #1d2c3d;
      --panel-2: #24394d;
      --line: #3c536d;
      --text: #edf6ff;
      --gold: #f1c40f;
      --danger: #ef4444;
      --accent: #38bdf8;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0f1724 0%, #111827 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #app {
      width: min(1200px, 100%);
    }

    .panel {
      background: rgba(18, 29, 44, 0.9);
      border: 2px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.28);
    }

    .hero-screen {
      padding: 26px;
      display: grid;
      gap: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .hero-card {
      background: var(--panel);
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .hero-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .hero-card.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.35);
    }

    .hero-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 1.2rem;
    }

    .hero-cost {
      color: var(--gold);
      font-size: 0.9rem;
    }

    .hero-card p {
      margin: 6px 0;
      color: #dfeaf7;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 6px;
    }

    button {
      border: none;
      border-radius: 10px;
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color: white;
      padding: 14px 26px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.14s ease, filter 0.14s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .game-shell {
      display: grid;
      gap: 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 0.98rem;
    }

    .hud-left, .hud-right {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
    }

    .health-bar {
      width: 200px;
      height: 16px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
    }

    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #22c55e, #84cc16, #f59e0b, #ef4444);
      width: 100%;
      transition: width 0.12s ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #050b12;
      border: 2px solid var(--line);
      border-radius: 12px;
      image-rendering: auto;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 4px 4px;
      color: #dfeaf7;
      font-size: 0.95rem;
    }

    .controls strong {
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const HEROES = {
      squire: {
        id: 'squire',
        name: 'Squire',
        color: '#3b82f6',
        hp: 120,
        speed: 4,
        damage: 18,
        ability: { name: 'Grand Slash', cooldown: 1.1, color: '#ef4444', damage: 60 },
        description: 'Balanced starter knight.'
      },
      pyro: {
        id: 'pyro',
        name: 'Pyromancer',
        color: '#f97316',
        hp: 90,
        speed: 4.2,
        damage: 20,
        ability: { name: 'Inferno Blast', cooldown: 1.2, color: '#f97316', damage: 72 },
        description: 'Fast burst damage mage.'
      },
      valkyrie: {
        id: 'valkyrie',
        name: 'Frost Valkyrie',
        color: '#22c55e',
        hp: 150,
        speed: 3.8,
        damage: 17,
        ability: { name: 'Glacial Strike', cooldown: 1.4, color: '#38bdf8', damage: 64 },
        description: 'Tough melee bruiser.'
      }
    };

    const app = document.getElementById('app');
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 960;
    canvas.height = 500;

    let screen = 'hero';
    let selectedHeroId = 'squire';
    let gems = 0;
    let wave = 1;
    let player = null;
    let monsters = [];
    let projectiles = [];
    let particles = [];
    let floatingTexts = [];
    let lastTime = 0;
    let keys = {};
    let textFlash = '';
    let gameRunning = false;

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function createPlayer() {
      const hero = HEROES[selectedHeroId];
      return {
        x: 80,
        y: 360,
        w: 38,
        h: 52,
        vx: 0,
        vy: 0,
        speed: hero.speed,
        hp: hero.hp,
        maxHp: hero.hp,
        facing: 1,
        grounded: false,
        jumpsLeft: 1,
        maxJumps: 1,
        attackCooldown: 0,
        attackTimer: 0,
        abilityCooldown: 0,
        swordDamage: hero.damage,
        color: hero.color,
        heroId: hero.id,
        ability: { ...hero.ability }
      };
    }

    function spawnMonster() {
      const types = ['SLASHER', 'TANK', 'MAGE'];
      const type = types[Math.floor(Math.random() * types.length)];
      const side = Math.random() > 0.5 ? 1 : -1;
      let w = 34, h = 44, hp = 32 + wave * 6, speed = 1.2 + wave * 0.08, color = '#ef4444';

      if (type === 'TANK') {
        w = 52; h = 58; hp = 75 + wave * 12; speed = 0.85 + wave * 0.04; color = '#a3a3a3';
      } else if (type === 'MAGE') {
        w = 36; h = 48; hp = 45 + wave * 9; speed = 1 + wave * 0.05; color = '#a855f7';
      }

      monsters.push({
        id: `m-${Date.now()}-${Math.random()}`,
        x: side > 0 ? canvas.width + 30 : -60,
        y: 360,
        w,
        h,
        hp,
        maxHp: hp,
        speed,
        color,
        type,
        facing: side > 0 ? -1 : 1,
        attackCooldown: rand(30, 90),
        telegraph: 0,
        isBoss: false
      });
    }

    function spawnWave() {
      monsters = [];
      projectiles = [];
      particles = [];
      floatingTexts = [];

      const count = Math.min(3 + Math.floor(wave * 0.7), 8);
      for (let i = 0; i < count; i++) {
        spawnMonster();
      }

      if (wave % 5 === 0) {
        monsters.push({
          id: `boss-${wave}`,
          x: canvas.width - 150,
          y: 300,
          w: 90,
          h: 110,
          hp: 260 + wave * 70,
          maxHp: 260 + wave * 70,
          speed: 1.1,
          color: '#8b5cf6',
          type: 'BOSS',
          facing: -1,
          attackCooldown: 40,
          telegraph: 0,
          isBoss: true
        });
      }
    }

    function addParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: rand(-2.5, 2.5),
          vy: rand(-2.5, 2.5),
          life: rand(18, 35),
          size: rand(2, 5),
          color
        });
      }
    }

    function addFloatingText(x, y, text, color) {
      floatingTexts.push({ x, y, text, color, life: 42 });
    }

    function damagePlayer(amount) {
      if (!player) return;
      player.hp = Math.max(0, player.hp - amount);
      addFloatingText(player.x + player.w / 2, player.y, String(Math.ceil(amount)), '#ef4444');
      if (player.hp <= 0) {
        textFlash = 'YOU WERE DEFEATED';
        screen = 'hero';
        renderUI();
        return;
      }
    }

    function doMeleeAttack() {
      if (!player) return;
      const hitboxX = player.facing === 1 ? player.x + player.w : player.x - 48;
      const hitboxY = player.y + 10;
      let damage = player.swordDamage;

      for (const mon of monsters) {
        const hit =
          hitboxX < mon.x + mon.w &&
          hitboxX + 48 > mon.x &&
          hitboxY < mon.y + mon.h &&
          hitboxY + 32 > mon.y;

        if (hit) {
          mon.hp -= damage;
          addFloatingText(mon.x + mon.w / 2, mon.y, String(damage), '#facc15');
          addParticles(mon.x + mon.w / 2, mon.y + mon.h / 2, '#facc15', 12);
          if (mon.hp <= 0) {
            gems += mon.isBoss ? 10 : 2;
            addFloatingText(mon.x + mon.w / 2, mon.y - 18, '+ ' + (mon.isBoss ? 10 : 2) + ' gems', '#22c55e');
          }
        }
      }
    }

    function doAbility() {
      if (!player || player.abilityCooldown > 0) return;
      player.abilityCooldown = player.ability.cooldown;
      const damage = player.ability.damage;
      const originX = player.x + player.w / 2;
      const originY = player.y + 18;

      projectiles.push({
        x: originX,
        y: originY,
        vx: player.facing * 9,
        vy: 0,
        radius: 18,
        damage,
        color: player.ability.color,
        life: 60,
        fromPlayer: true
      });

      addParticles(originX, originY, player.ability.color, 18);
      addFloatingText(originX, originY - 12, player.ability.name, player.ability.color);
    }

    function startGame() {
      screen = 'game';
      wave = 1;
      gems = 0;
      textFlash = '';
      player = createPlayer();
      spawnWave();
      gameRunning = true;
      lastTime = 0;
      renderUI();
    }

    function keydownHandler(event) {
      const code = event.code;
      keys[code] = true;

      if (code === 'KeyJ' && player && screen === 'game') {
        if (player.attackCooldown <= 0) {
          player.attackCooldown = 0.3;
          player.attackTimer = 0.12;
          doMeleeAttack();
        }
      }

      if (code === 'KeyK' && player && screen === 'game') {
        doAbility();
      }

      if (code === 'Space' || code === 'KeyW' || code === 'ArrowUp') {
        if (player && player.grounded) {
          player.vy = -12;
          player.grounded = false;
          player.jumpsLeft = 0;
        }
      }
    }

    function keyupHandler(event) {
      keys[event.code] = false;
    }

    document.addEventListener('keydown', keydownHandler);
    document.addEventListener('keyup', keyupHandler);

    function update(dt) {
      if (screen !== 'game' || !player) return;

      if (keys['KeyA'] || keys['ArrowLeft']) {
        player.vx = -player.speed;
        player.facing = -1;
      } else if (keys['KeyD'] || keys['ArrowRight']) {
        player.vx = player.speed;
        player.facing = 1;
      } else {
        player.vx *= 0.72;
      }

      if (player.attackCooldown > 0) player.attackCooldown -= dt;
      if (player.abilityCooldown > 0) player.abilityCooldown -= dt;
      if (player.attackTimer > 0) player.attackTimer -= dt;

      player.vy += 0.65 * dt;
      player.x += player.vx * dt * 60;
      player.y += player.vy * dt * 60;

      const groundY = canvas.height - 50;
      if (player.y + player.h >= groundY) {
        player.y = groundY - player.h;
        player.vy = 0;
        player.grounded = true;
      } else {
        player.grounded = false;
      }

      player.x = clamp(player.x, 0, canvas.width - player.w);

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt * 60;

        if (p.fromPlayer) {
          for (let j = monsters.length - 1; j >= 0; j--) {
            const mon = monsters[j];
            const dx = mon.x + mon.w / 2 - p.x;
            const dy = mon.y + mon.h / 2 - p.y;
            const dist = Math.hypot(dx, dy);
            if (dist < (mon.w + mon.h) * 0.4) {
              mon.hp -= p.damage;
              addFloatingText(mon.x + mon.w / 2, mon.y, String(p.damage), '#38bdf8');
              addParticles(mon.x + mon.w / 2, mon.y + mon.h / 2, p.color, 12);
              projectiles.splice(i, 1);
              if (mon.hp <= 0) {
                monsters.splice(j, 1);
                gems += mon.isBoss ? 10 : 2;
              }
              break;
            }
          }
        }

        if (p.life <= 0) {
          projectiles.splice(i, 1);
        }
      }

      for (let i = monsters.length - 1; i >= 0; i--) {
        const mon = monsters[i];
        if (mon.isBoss) {
          if (Math.abs(mon.x - player.x) > 140) {
            mon.x += (player.x < mon.x ? -1 : 1) * mon.speed * dt * 60;
          } else {
            mon.attackCooldown -= dt * 60;
            if (mon.attackCooldown <= 0) {
              mon.attackCooldown = 60;
              const dir = player.x < mon.x ? -1 : 1;
              projectiles.push({
                x: mon.x + mon.w / 2,
                y: mon.y + mon.h / 2,
                vx: dir * 7,
                vy: 0,
                radius: 12,
                damage: 12,
                color: '#f43f5e',
                life: 80,
                fromPlayer: false
              });
            }
          }
        } else {
          const dir = player.x < mon.x ? -1 : 1;
          mon.x += dir * mon.speed * dt * 60;
          mon.facing = dir;
          mon.attackCooldown -= dt * 60;
          if (Math.abs(mon.x - player.x) < 44 && mon.attackCooldown <= 0) {
            mon.attackCooldown = 60;
            damagePlayer(mon.type === 'TANK' ? 16 : mon.type === 'MAGE' ? 12 : 9);
          }
        }

        if (mon.hp <= 0) {
          monsters.splice(i, 1);
          addParticles(mon.x + mon.w / 2, mon.y + mon.h / 2, mon.color, 16);
          gems += mon.isBoss ? 15 : 2;
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!p.fromPlayer && p.x + p.radius > 0 && p.x - p.radius < canvas.width) {
          const hit =
            p.x > player.x &&
            p.x < player.x + player.w &&
            p.y > player.y &&
            p.y < player.y + player.h;
          if (hit) {
            damagePlayer(p.damage);
            projectiles.splice(i, 1);
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt * 60;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const f = floatingTexts[i];
        f.y -= 0.35 * dt * 60;
        f.life -= dt * 60;
        if (f.life <= 0) floatingTexts.splice(i, 1);
      }

      if (monsters.length === 0) {
        wave += 1;
        spawnWave();
      }
    }

    function drawBackground() {
      ctx.fillStyle = '#071018';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let x = 0; x < canvas.width; x += 80) {
        ctx.fillStyle = 'rgba(255,255,255,0.02)';
        ctx.fillRect(x, 0, 1, canvas.height);
      }

      ctx.fillStyle = '#1f2937';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, canvas.height - 52, canvas.width, 5);
    }

    function drawPlayer() {
      if (!player) return;

      const px = player.x;
      const py = player.y;
      ctx.fillStyle = player.color;
      ctx.fillRect(px, py, player.w, player.h);

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(px + 6, py + 10, 8, 8);
      ctx.fillRect(px + player.w - 14, py + 10, 8, 8);

      if (player.attackTimer > 0) {
        const swingX = player.facing === 1 ? px + player.w : px - 42;
        ctx.strokeStyle = '#f8fafc';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(swingX + 20, py + 22, 26, player.facing === 1 ? -Math.PI / 2 : -Math.PI / 2 + Math.PI, player.facing === 1 ? Math.PI / 2 : Math.PI / 2 + Math.PI);
        ctx.stroke();
      }
    }

    function drawMonsters() {
      for (const mon of monsters) {
        ctx.fillStyle = mon.color;
        ctx.fillRect(mon.x, mon.y, mon.w, mon.h);

        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(mon.x, mon.y - 10, mon.w, 6);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(mon.x, mon.y - 10, (mon.hp / mon.maxHp) * mon.w, 6);
      }
    }

    function drawProjectiles() {
      for (const p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius || 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    }

    function drawFloatingTexts() {
      ctx.font = 'bold 18px Arial';
      for (const f of floatingTexts) {
        ctx.fillStyle = f.color;
        ctx.fillText(f.text, f.x, f.y);
      }
    }

    function drawHUD() {
      if (!player) return;
      const healthPct = (player.hp / player.maxHp) * 100;
      ctx.fillStyle = 'rgba(15,23,42,0.72)';
      ctx.fillRect(18, 18, 260, 58);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('HP', 30, 42);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(70, 24, 180, 16);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(70, 24, (healthPct / 100) * 180, 16);
      ctx.fillStyle = '#f8fafc';
      ctx.fillText(`${Math.ceil(player.hp)} / ${player.maxHp}`, 70, 60);

      ctx.fillStyle = '#f8fafc';
      ctx.fillText(`Wave ${wave}`, 410, 36);
      ctx.fillText(`Gems ${gems}`, 410, 58);
      ctx.fillText(`Ability ${player.ability.name}`, 540, 36);
      ctx.fillText(`Cooldown ${Math.max(0, player.abilityCooldown).toFixed(1)}s`, 540, 58);
    }

    function renderFrame() {
      drawBackground();
      drawPlayer();
      drawMonsters();
      drawProjectiles();
      drawParticles();
      drawFloatingTexts();
      drawHUD();

      if (textFlash) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(canvas.width / 2 - 220, 140, 440, 80);
        ctx.fillStyle = '#fef3c7';
        ctx.font = 'bold 32px Arial';
        ctx.fillText(textFlash, canvas.width / 2 - 180, 190);
      }
    }

    function renderUI() {
      if (screen === 'hero') {
        app.innerHTML = `
          <div class="panel hero-screen">
            <h1>Monster Wave Slayer</h1>
            <div class="hero-grid">
              ${Object.values(HEROES).map(hero => `
                <div class="hero-card ${selectedHeroId === hero.id ? 'selected' : ''}" data-id="${hero.id}">
                  <div class="hero-name">
                    <span>${hero.name}</span>
                    <span class="hero-cost">${hero.hp} HP</span>
                  </div>
                  <p>${hero.description}</p>
                  <p><strong>Move:</strong> A / D</p>
                  <p><strong>Jump:</strong> W / Space</p>
                  <p><strong>Attack:</strong> J</p>
                  <p><strong>Ability:</strong> K</p>
                </div>
              `).join('')}
            </div>
            <div class="actions">
              <button id="start-game">Start Battle</button>
            </div>
          </div>
        `;

        document.querySelectorAll('.hero-card').forEach(card => {
          card.addEventListener('click', () => {
            selectedHeroId = card.dataset.id;
            renderUI();
          });
        });

        document.getElementById('start-game').addEventListener('click', startGame);
        return;
      }

      app.innerHTML = `
        <div class="game-shell">
          <div class="panel hud">
            <div class="hud-left">
              <span class="badge">Hero: ${HEROES[selectedHeroId].name}</span>
              <span class="badge">Wave: ${wave}</span>
              <span class="badge">Gems: ${gems}</span>
            </div>
            <div class="hud-right">
              <span class="badge">HP</span>
              <div class="health-bar"><div class="health-fill" style="width:${(player ? (player.hp / player.maxHp) * 100 : 100)}%"></div></div>
            </div>
          </div>
          <div id="game-root"></div>
          <div class="controls">
            <span><strong>Move:</strong> A / D</span>
            <span><strong>Jump:</strong> W / Space</span>
            <span><strong>Attack:</strong> J</span>
            <span><strong>Ability:</strong> K</span>
          </div>
        </div>
      `;

      const root = document.getElementById('game-root');
      root.innerHTML = '';
      root.appendChild(canvas);
    }

    function loop(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min((ts - lastTime) / 1000, 0.032);
      lastTime = ts;

      update(dt);
      renderFrame();
      requestAnimationFrame(loop);
    }

    renderUI();
    renderFrame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
